services:
  mindwtr-cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:1.3.3
    container_name: mindwtr-cloud
    hostname: mindwtr-cloud
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/health >/dev/null || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - MINDWTR_CLOUD_AUTH_TOKENS=${MINDWTR_CLOUD_AUTH_TOKENS:?must be set}
      - MINDWTR_CLOUD_CORS_ORIGIN=${MINDWTR_CLOUD_CORS_ORIGIN:?must be set}
      - MINDWTR_CLOUD_MAX_BODY_BYTES=${MINDWTR_CLOUD_MAX_BODY_BYTES:-2000000}
      - MINDWTR_CLOUD_MAX_ATTACHMENT_BYTES=${MINDWTR_CLOUD_MAX_ATTACHMENT_BYTES:-50000000}
    volumes:
      - ./data:/app/cloud_data:Z
    networks:
      - npm

  mindwtr-app:
    image: ghcr.io/dongdongbh/mindwtr-app:1.3.3
    container_name: mindwtr-app
    hostname: mindwtr-app
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    depends_on:
      mindwtr-cloud:
        condition: service_healthy
    networks:
      - npm

networks:
  npm:
    name: nginx_default
    external: true